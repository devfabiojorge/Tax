<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulta NCM</title>

<style>
:root {
  --primary: rgb(255, 0, 127);
}

body {
  font-family: Arial, sans-serif;
  background: #ffffff;
  margin: 0;
}

.container {
  max-width: 800px;
  margin: 40px auto;
  background: #fff;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

h1 {
  text-align: center;
  color: var(--primary);
}

.search-box {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}

input {
  flex: 1;
  padding: 12px;
  border: 2px solid var(--primary);
  border-radius: 6px;
  font-size: 16px;
}

button {
  padding: 12px 16px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 15px;
  color: #fff;
  background: var(--primary);
}

button:hover {
  opacity: 0.85;
}

.result {
  margin-top: 20px;
}

.card {
  background: #fafafa;
  border-left: 5px solid var(--primary);
  padding: 15px;
  border-radius: 8px;
  margin-bottom: 15px;
}

.label {
  font-weight: bold;
  color: #555;
}

.error {
  color: red;
  text-align: center;
}

.loading {
  text-align: center;
}

.actions {
  margin-top: 10px;
  display: flex;
  gap: 10px;
  justify-content: space-between;
}

</style>
</head>
<body>

<div class="container">
  <h1>Consulta NCM</h1>

  <div class="search-box">
    <input id="ncmInput" placeholder="0000.00.00">
    <button onclick="buscarNCM()">Buscar</button>
  </div>

  <div class="actions">
    <button onclick="limpar()">Limpar</button>
    <button onclick="ordenar()">Ordenar</button>
  </div>

  <div id="result" class="result"></div>
</div>

<script>
let resultados = [];

// Máscara NCM
document.getElementById('ncmInput').addEventListener('input', function(e) {
  let value = e.target.value.replace(/\D/g, '').slice(0, 8);

  if (value.length > 4 && value.length <= 6) {
    value = value.replace(/(\d{4})(\d+)/, '$1.$2');
  } else if (value.length > 6) {
    value = value.replace(/(\d{4})(\d{2})(\d+)/, '$1.$2.$3');
  }

  e.target.value = value;
});

// Enter para buscar
document.getElementById('ncmInput').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') buscarNCM();
});

async function buscarNCM() {
  const inputRaw = document.getElementById('ncmInput').value;
  const input = inputRaw.replace(/\D/g, '');
  const resultDiv = document.getElementById('result');

  if (!input) {
    resultDiv.innerHTML = '<p class="error">Informe um NCM válido.</p>';
    return;
  }

  // Cache
  const cache = JSON.parse(localStorage.getItem('ncmCache') || '{}');

  if (cache[input]) {
    resultados = cache[input];
    render();
    return;
  }

  resultDiv.innerHTML = '<p class="loading">Carregando...</p>';

  try {
    const response = await fetch(`https://brasilapi.com.br/api/ncm/v1?search=${input}`);
    const data = await response.json();

    if (!data.length) {
      resultDiv.innerHTML = '<p class="error">Nenhum resultado encontrado.</p>';
      return;
    }

    resultados = data;

    // salva cache
    cache[input] = data;
    localStorage.setItem('ncmCache', JSON.stringify(cache));

    render();

  } catch {
    resultDiv.innerHTML = '<p class="error">Erro ao buscar dados.</p>';
  }
}

// Render
function render() {
  const resultDiv = document.getElementById('result');
  resultDiv.innerHTML = '';

  resultados.forEach(item => {
    resultDiv.innerHTML += `
      <div class="card">
        <div><span class="label">Código:</span> ${item.codigo}</div>
        <div><span class="label">Descrição:</span> ${item.descricao}</div>
        <div><span class="label">Data Início:</span> ${item.data_inicio || '-'}</div>
        <div><span class="label">Data Fim:</span> ${item.data_fim || '-'}</div>
        <div><span class="label">Tipo Ato:</span> ${item.tipo_ato || '-'}</div>
        <div><span class="label">Número Ato:</span> ${item.numero_ato || '-'}</div>
        <div><span class="label">Ano Ato:</span> ${item.ano_ato || '-'}</div>
      </div>
    `;
  });
}

// Ordenar
function ordenar() {
  resultados.sort((a, b) => a.codigo.localeCompare(b.codigo));
  render();
}

// Limpar
function limpar() {
  document.getElementById('ncmInput').value = '';
  document.getElementById('result').innerHTML = '';
}
</script>

</body>
</html>
